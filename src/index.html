<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Juan Sebastián Clavijo | Ingeniero de Software & Full Stack Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portafolio profesional de Juan Sebastián Clavijo - Ingeniero de Software, Desarrollador Full Stack (.NET, Angular) y Creador de Videojuegos en Unity.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/x-icon" href="assets/logo/LogoPortafolio.png" />

  <!-- Google Fonts: Inter, Plus Jakarta Sans, Montserrat y Orbitron (para zona gaming) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Orbitron:wght@600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css" rel="stylesheet">

  <!-- Angular Material -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">   
</head>
<body>
  <app-root>
    <style>
      body {
        margin: 0;
        background-color: #0b1120;
      }
      .startup-loader-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background-color: #0b1120;
        color: #10b981;
        font-family: 'Plus Jakarta Sans', 'Montserrat', sans-serif;
        z-index: 99999;
      }
      .startup-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(16, 185, 129, 0.15);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: startup-spin 1s ease-in-out infinite;
        margin-bottom: 25px;
      }
      .startup-text {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        animation: startup-pulse 1.5s infinite;
      }
      @keyframes startup-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes startup-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
    <div class="startup-loader-container">
      <div class="startup-spinner"></div>
      <div class="startup-text">CARGANDO PORTAFOLIO...</div>
    </div>
  </app-root>
</body>
</html>
